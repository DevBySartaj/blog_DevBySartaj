<svg xmlns="http://w3.org" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <!-- Cyan to Purple Vibrant Gradient for Developer Vibe -->
    <linearGradient id="devGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    
    <!-- Clean Gold/Orange Gradient for Sartaj (King/Premium feel) -->
    <linearGradient id="sartajGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#e11d48" />
    </linearGradient>

    <!-- Subtle Glow for Code Elements -->
    <filter id="codeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Transparent Background to perfectly merge with your live website -->
  <rect width="100%" height="100%" fill="transparent" />

  <!-- Code Bracket Icon (</>) with Crown Touch for 'Sartaj' -->
  <g filter="url(#codeGlow)">
    <!-- Left Bracket < -->
    <path d="M 45 40 L 25 60 L 45 80" stroke="url(#devGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Bracket > -->
    <path d="M 85 40 L 105 60 L 85 80" stroke="url(#devGrad)" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Slash / -->
    <path d="M 70 35 L 60 85" stroke="url(#sartajGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Typography Alignment -->
  <!-- 'Dev' in Techy Code Font style -->
  <text x="125" y="72" 
        font-family="'Fira Code', 'Courier New', monospace, sans-serif" 
        font-weight="700" 
        font-size="42" 
        fill="url(#devGrad)" 
        letter-spacing="-1">
    dev.
  </text>

  <!-- 'Sartaj' in Premium Bold Bold Style -->
  <text x="230" y="72" 
        font-family="'Montserrat', 'Segoe UI', sans-serif" 
        font-weight="900" 
        font-size="44" 
        fill="url(#sartajGrad)" 
        letter-spacing="1">
    SARTAJ
  </text>

  <!-- Glowing Terminal Cursor Element '_' -->
  <text x="440" y="70" 
        font-family="monospace" 
        font-weight="900" 
        font-size="44" 
        fill="#06b6d4" 
        opacity="0.8">
    _
  </text>
</svg>
